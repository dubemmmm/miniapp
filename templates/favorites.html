{% extends "temp.html" %}

{% block hero_section %}
<section class="pt-6 sm:pt-8 pb-2 text-center px-4">
    <div class="eyebrow coral" style="margin-bottom: 10px; font-size: 10px;">
        ● {% if request.user.first_name %}{{ request.user.first_name }}'s{% else %}My{% endif %} collection
    </div>
    <h1 class="serif-display" style="font-size: clamp(36px, 6vw, 84px); margin: 0 0 10px; letter-spacing: -0.02em;">
        Saved <span class="italic-accent">properties</span>
    </h1>
    <p style="font-size: clamp(13px, 2vw, 15.5px); color: var(--slate-600); max-width: 520px; line-height: 1.55; margin: 0 auto 8px;">
        Every property you've liked lives here. Filter, explore, and open full
        details just like the main portfolio.
    </p>
</section>
{% endblock %}
