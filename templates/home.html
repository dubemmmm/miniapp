<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body class="bg-gray-50 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Home Page. You are logged in</h1>

    <form method="post" action="{% url 'logout' %}" class="mb-4">
      {% csrf_token %}
      <button type="submit" class="text-gray-300 hover:text-white transition-colors flex items-center gap-1">
        <i class="fas fa-sign-out-alt"></i>
        <span class="hidden md:inline">Log Out</span>
      </button>
    </form>

    <button id="syncAirtableBtn" class="btn-primary text-white rounded font-semibold flex items-center gap-2" type="button">
      <i class="fas fa-sync"></i>
      <span class="hidden md:inline">Sync with Airtable</span>
    </button>

    <!-- add a place to show status -->
    <p id="syncStatus" class="mt-4 text-sm"></p>

    <!-- Dynamic Data for JS -->
    <script>
      // CSRF Token and URLs
      const CSRF_TOKEN = '{{ csrf_token }}';
      const URLS = {
          syncAirtable: '{% url "sync_airtable" %}'
      };
    </script>

    <script src="{% static 'miniapp/js/home.js' %}"></script>
  </body>
</html>
