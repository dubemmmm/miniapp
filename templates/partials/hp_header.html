{% load static %}
<header class="cw-nav-wrap">
    <nav class="cw-nav" aria-label="Primary">
        <a href="{% url 'home' %}" class="cw-nav-logo" aria-label="CW Real Estate home">CW</a>
        <div class="cw-nav-links">
            <a href="{% url 'home' %}#market">Market</a>
            <a href="{% url 'neighbourhood_index' %}">Neighbourhoods</a>
            <a href="{% url 'compare_neighbourhoods_index' %}">Compare</a>
            <a href="{% url 'home' %}#recent">Projects</a>
        </div>
        <div class="cw-nav-actions">
            {% if user.is_authenticated %}
            <a href="{% url 'temp' %}" class="cw-btn cw-btn-navy cw-btn-sm">My portfolio</a>
            {% else %}
            <a href="{% url 'login' %}" class="cw-nav-signin">Sign in</a>
            <a href="{% url 'request_access' %}" class="cw-btn cw-btn-navy cw-btn-sm">Request private access</a>
            {% endif %}
        </div>
        <button type="button" class="cw-nav-toggle" aria-expanded="false" aria-controls="cw-mobile-nav" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div id="cw-mobile-nav">
        <a href="{% url 'home' %}#market">Market</a>
        <a href="{% url 'neighbourhood_index' %}">Neighbourhoods</a>
        <a href="{% url 'compare_neighbourhoods_index' %}">Compare</a>
        <a href="{% url 'home' %}#recent">Projects</a>
        {% if user.is_authenticated %}
        <a href="{% url 'temp' %}" class="cw-btn cw-btn-navy">My portfolio</a>
        {% else %}
        <a href="{% url 'login' %}">Sign in</a>
        <a href="{% url 'request_access' %}" class="cw-btn cw-btn-navy">Request private access</a>
        {% endif %}
    </div>
</header>
